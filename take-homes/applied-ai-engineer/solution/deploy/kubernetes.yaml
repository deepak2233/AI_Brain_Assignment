apiVersion: v1
kind: ConfigMap
metadata:
  name: betterbark-runtime
data:
  BETTERBARK_ENV: production
  BETTERBARK_SINK_MODE: live
  BETTERBARK_TRANSCRIPTS_DIR: /data/input
  BETTERBARK_EXISTING_ISSUES: /data/config/existing_issues.json
  BETTERBARK_STATE: /data/state/state.db
  LOG_LEVEL: INFO
  OPENAI_MODEL: REPLACE_WITH_PRIMARY_MODEL
  OPENAI_FALLBACK_MODEL: REPLACE_WITH_FALLBACK_MODEL
  OPENAI_MAX_ATTEMPTS: "3"
  OPENAI_TIMEOUT_SECONDS: "75"
  MODEL_CIRCUIT_FAILURE_THRESHOLD: "3"
  MODEL_CIRCUIT_COOLDOWN_SECONDS: "60"
  OUTBOX_MAX_ATTEMPTS: "5"
  SINK_HTTP_MAX_ATTEMPTS: "3"
  SINK_HTTP_TIMEOUT_SECONDS: "20"
  MAX_TRANSCRIPT_BYTES: "2000000"
  SERVICE_NAME: betterbark-intake
  SERVICE_VERSION: REPLACE_WITH_IMAGE_VERSION
  JIRA_PRIORITY_NAMES_JSON: '{"P1":"Highest","P2":"High","P3":"Medium","P4":"Low"}'
  SLACK_OWNER_IDS_JSON: '{}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: betterbark-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: betterbark-input
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: betterbark-scan
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scan
              image: ghcr.io/your-org/betterbark-intake:REPLACE_WITH_VERSION
              imagePullPolicy: IfNotPresent
              args:
                - --state
                - /data/state/state.db
                - scan
                - --provider
                - openai
              envFrom:
                - configMapRef:
                    name: betterbark-runtime
                - secretRef:
                    name: betterbark-secrets
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: state
                  mountPath: /data/state
                - name: input
                  mountPath: /data/input
                  readOnly: true
                - name: existing-issues
                  mountPath: /data/config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: betterbark-state
            - name: input
              persistentVolumeClaim:
                claimName: betterbark-input
            - name: existing-issues
              configMap:
                name: betterbark-existing-issues
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: betterbark-dispatch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dispatch
              image: ghcr.io/your-org/betterbark-intake:REPLACE_WITH_VERSION
              imagePullPolicy: IfNotPresent
              args:
                - --state
                - /data/state/state.db
                - dispatch
              envFrom:
                - configMapRef:
                    name: betterbark-runtime
                - secretRef:
                    name: betterbark-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: state
                  mountPath: /data/state
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: betterbark-state
            - name: tmp
              emptyDir: {}
